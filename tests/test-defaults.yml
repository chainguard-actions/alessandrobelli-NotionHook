name: Test default inputs - NotionHook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run NotionHook action with minimal required inputs (defaults for others)
        id: action
        uses: .
        continue-on-error: true
        with:
          notion_secret: fake-secret-minimal
          notion_database: fake-database-minimal

      - name: Assert action ran with defaults (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should have run (either success or failure due to API call)
          # It should NOT be 'skipped' which would indicate it never ran
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, it should have run"
            exit 1
          fi
          echo "PASS: action ran with default inputs, outcome=$OUTCOME"
