name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          notion_secret: dummy-secret-for-testing
          notion_database: dummy-database-id-for-testing
          commit_description: description
          commit_url: Url
          commit_id: Id
          commit_project: Project
      - name: Assert action ran (credentials expected to fail gracefully)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with invalid credentials.
          # We only verify it was invoked (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran as expected"
