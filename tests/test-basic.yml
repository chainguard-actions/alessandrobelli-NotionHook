name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires notion_secret and notion_database.
      # Under workflow_dispatch there are no commits in the payload,
      # so github.context.payload.commits is undefined and the action
      # will throw a TypeError when it tries to call .forEach on it.
      # We verify the action fails with that expected runtime error
      # (not a missing-module or startup error), confirming the action
      # code loads and executes correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          notion_secret: "secret_fake_notion_key_for_testing_only"
          notion_database: "fake-database-id-00000000000000000000"
          commit_description: "description"
          commit_url: "Url"
          commit_id: "Id"
          commit_project: "Project"
          files_format: "none"

      - name: Assert action ran and failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (no commits in workflow_dispatch payload)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing commits payload, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (no commits in workflow_dispatch payload)"
