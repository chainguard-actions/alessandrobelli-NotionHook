name: Test default input values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts only the required inputs (notion_secret,
      # notion_database) and uses defaults for the rest. The action will fail
      # because workflow_dispatch has no commits payload, but we confirm it
      # starts up and fails at runtime (not at input validation / module load).
      - id: action
        uses: .
        continue-on-error: true
        with:
          notion_secret: "secret_fake_notion_key_for_testing_only"
          notion_database: "fake-database-id-00000000000000000000"
          # commit_description defaults to "description"
          # commit_url defaults to "Url"
          # commit_id defaults to "Id"
          # commit_project defaults to "Project"
          # files_format defaults to "text-list"
          # token is optional — omit it

      - name: Assert action ran and failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because workflow_dispatch provides no commits
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing commits payload, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with default inputs (no commits in workflow_dispatch payload)"
