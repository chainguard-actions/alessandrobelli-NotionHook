name: Test custom column names
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          notion_secret: "secret_fakecredential1234567890abcdef"
          notion_database: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
          commit_description: "CommitMessage"
          commit_url: "CommitURL"
          commit_id: "CommitHash"
          commit_project: "MyProject"
        env:
          GITHUB_REF: refs/heads/feature-branch
          GITHUB_EVENT_NAME: push
      - name: Assert action ran with custom column names
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (and fail due to invalid credentials),
          # but must not be skipped — proving it accepted the custom inputs.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it did not run at all"
            exit 1
          fi
          echo "PASS: action ran with custom column names (outcome=$OUTCOME)"
